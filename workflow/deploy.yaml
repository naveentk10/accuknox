name: CI/CD for Wisecow

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: wisecowhub
  REGISTRY: docker.io
  DEPLOYMENT_NAME: wisecow-deployment
  NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.naveentk10 }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    - name: Extract short SHA
      id: vars
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.naveentk10 }}/wisecowhub,${{ secrets.naveentk10 }}/wisecow:${{ steps.vars.outputs.SHORT_SHA }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        kubectl config get-contexts

    - name: Update deployment image
      run: |
        kubectl --kubeconfig=kubeconfig set image deployment/${{ env.wisecow-deployment }} \
        wisecow=${{ secrets.naveentk10 }}/wisecow:${{ steps.vars.outputs.SHORT_SHA }} \
        --namespace=${{ env.NAMESPACE }}
